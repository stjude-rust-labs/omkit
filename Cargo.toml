[workspace]
members = [
    "omkit",
]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"
authors = ["The omkit project developers"]
description = "A cross-platform command line toolkit for omics-based analysis"
homepage = "https://github.com/stjude-rust-labs/omkit"
repository = "https://github.com/stjude-rust-labs/omkit"
rust-version = "1.94.0"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
thiserror = "2.0.18"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
